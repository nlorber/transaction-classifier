version: 2
updates:
  # Minor and patch bumps arrive as one monthly PR, security fixes as one
  # grouped PR. Major bumps are migrations, taken by hand. An update-types
  # ignore never blocks a security update.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Both need numpy 2, which pyproject.toml caps below 2: shap 0.51 requires
      # it, and pandas-stubs 3.0.5 types astype() through np.bool, which numpy 1
      # lacks. Lift with the numpy 2 migration.
      - dependency-name: "shap"
        versions: [">=0.51"]
      - dependency-name: "pandas-stubs"
        versions: [">=3.0.5"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
